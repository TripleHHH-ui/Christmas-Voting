<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Results — Golden Hour, Midnight Glamour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E" />
<meta name="theme-color" content="#faf5e6" />
<meta name="robots" content="noindex" />
</head>
<body>
<div class="container wide">
  <div class="title-block">
    <img class="emblem" src="emblem.svg" alt="Festive Art Deco emblem with Christmas trees" />
    <h1 class="display">Results &amp; Reveal</h1>
    <div class="sub muted">Live results · <a href="qr.html">← Back to QR code</a></div>
  </div>

  <div id="errorArea"></div>


  <!-- Main dashboard -->
  <section id="dashboard">
    <div class="stat-row">
      <div class="stat"><span class="num" id="statVoters">0</span><span class="lbl">Voters so far</span></div>
      <div class="stat"><span class="num" id="statTotal">44</span><span class="lbl">Total attendees</span></div>
      <div class="stat"><span class="num" id="statRemaining">44</span><span class="lbl">Remaining</span></div>
    </div>

    <div class="toolbar">
      <button class="btn btn-secondary btn-sm" id="btnRefresh">↻ Refresh</button>
      <button class="btn btn-secondary btn-sm" id="btnExport">⬇ Export CSV</button>
      <button class="btn btn-secondary btn-sm" id="btnReveal">🎉 Launch Top 3 Reveal</button>
      <button class="btn btn-danger btn-sm" id="btnResetOpen">⚠ Reset All Votes</button>
    </div>

    <div class="card deco-frame">
      <h2 class="display card-title">Live Leaderboard</h2>
      <div id="leaderboardWrap" class="table-scroll"></div>
    </div>
  </section>


  <!-- Reset confirm modal -->
  <section id="resetModal" class="card deco-frame" hidden>
    <h2 class="display center card-title">Reset All Votes?</h2>
    <p class="muted center">This permanently clears every vote. Enter the organiser PIN and type RESET to confirm.</p>
    <input type="password" id="resetPinInput" class="search-box" placeholder="Organiser PIN" inputmode="numeric" autocomplete="off" />
    <input type="text" id="resetConfirmInput" class="search-box" placeholder="Type RESET" />
    <button class="btn btn-danger" id="btnResetConfirm">Confirm Reset</button>
    <button class="btn btn-secondary" id="btnResetCancel" style="margin-top:10px;">Cancel</button>
  </section>
</div>
<script src="data.js"></script>
<script src="fx.js"></script>
<script src="storage.js"></script>
<script src="scoring.js"></script>
<script src="results.js"></script>
</body>
</html>
